    <script>
        function loadScriptWithFallback(cdnUrl, localUrl) {
            return new Promise((resolve, reject) => {
                var script = document.createElement('script');
                script.src = cdnUrl;
                script.onload = resolve;
                script.onerror = function() {
                    console.warn(cdnUrl + ' falló, intentando versión local...');
                    var localScript = document.createElement('script');
                    localScript.src = localUrl;
                    localScript.onload = resolve;
                    localScript.onerror = reject;
                    document.body.appendChild(localScript);
                };
                document.body.appendChild(script);
            });
        }


        (async function() {
            try {
                await loadScriptWithFallback(
                    'https://unpkg.com/leaflet/dist/leaflet.js',
                    'libs/leaflet/leaflet.js'
                );
                await loadScriptWithFallback(
                    'https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js',
                    'libs/leaflet-routing-machine/leaflet-routing-machine.js'
                );
                
            
                loadLocalScripts();
            } catch(error) {
                console.error('Error cargando librerías:', error);
                console.error('Detalles del error:', error.message);
            }
        })();

        function loadLocalScripts() {
            const version = '?v=' + Date.now();
            var scripts = [
                'scripts/script_capa.js' + version,           
                'scripts/mapbox_router_php.js' + version,
                'scripts/script_edificios.js' + version,      
                'scripts/script_panel_derecho.js' + version,
                'scripts/buscador.js' + version,
                'scripts/script_barra_responsiva.js' + version,
                'scripts/script_ruta.js' + version,
                'scripts/script_iconos.js' + version
            ];
            
            function loadScriptSequentially(index) {
                if (index >= scripts.length) return;
                
                var script = document.createElement('script');
                script.src = scripts[index];
                script.onload = function() {
                    loadScriptSequentially(index + 1);
                };
                script.onerror = function() {
                    console.error('Error cargando:', scripts[index]);
                    loadScriptSequentially(index + 1);
                };
                document.body.appendChild(script);
            }
            
            loadScriptSequentially(0);
        }
    </script>
